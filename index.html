<html lang="ja">

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>T・Sコーポレーション│予定表</title>

    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            }

            :root {
            font-size: 1.112vw;
            }

            html, body, p, ul, li, dl, dt, dd {
            margin: 0;
            padding: 0;
            font-family: "Noto Sans JP", sans-serif;
            font-weight: 400;
            }

            .contact-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            }

            .calendar-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            }
            .calendar-wrap > div {
            flex: 1;
            border-right: solid 1.5px #222;
            background-color: #979797;
            }
            .calendar-wrap > div .date {
            font-size: 0.85rem;
            font-weight: 600;
            height: 3rem;
            padding: 0.75rem;
            border-bottom: solid 3px #222;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #fff;
            }
            .calendar-wrap > div .shop {
            padding: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            height: fit-content;
            }
            .calendar-wrap > div .shop01 {
            background-color: #fbf8e3;
            }
            .calendar-wrap > div .shop02 {
            background-color: #faeef8;
            }
            .calendar-wrap > div .shop03 {
            background-color: #e7f0f6;
            }
            .calendar-wrap > div .shop04 {
            background-color: #f0f8ee;
            }
            .calendar-wrap > div .shop05 {
            background-color: #fbf3ea;
            }
            .calendar-wrap > div .shop .card {
            background-color: #fff;
            width: calc((100% - 0.25rem) / 2);
            height: fit-content;
            }
            .calendar-wrap > div .shop .card .card-top {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.1rem 0.4rem;
            font-size: 0.35rem;
            font-weight: 600;
            border-bottom: solid 1px #222;
            }
            .calendar-wrap > div .shop .card .card-bottom {
            font-size: 0.65rem;
            font-weight: 600;
            text-align: center;
            padding: 0.1rem 0.4rem;
            }
    </style>
</head>
