<script>
  // タッチ操作・マウスドラッグの両方で、pager（ページ全体）を横方向にスワイプして
  // 7日ずつのページを切り替えるための処理
  (function () {
    var pager = document.getElementById('pager');
    if (!pager) return;

    var pageCount = pager.children.length;
    var currentPage = 0;
    var startX = 0;
    var currentTranslate = 0;
    var isDragging = false;
    var pageWidthPx = 0;

    function updatePosition(withTransition) {
      pager.style.transition = withTransition ? 'transform 0.3s ease' : 'none';
      pageWidthPx = pager.parentElement.clientWidth;
      var offset = -(currentPage * pageWidthPx) + currentTranslate;
      pager.style.transform = 'translateX(' + offset + 'px)';
    }

    function onDragStart(x) {
      isDragging = true;
      startX = x;
      currentTranslate = 0;
      updatePosition(false);
    }

    function onDragMove(x) {
      if (!isDragging) return;
      currentTranslate = x - startX;
      updatePosition(false);
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;

      var threshold = pageWidthPx * 0.2;
      if (currentTranslate < -threshold && currentPage < pageCount - 1) {
        currentPage += 1;
      } else if (currentTranslate > threshold && currentPage > 0) {
        currentPage -= 1;
      }
      currentTranslate = 0;
      updatePosition(true);
    }

    // タッチ操作（タッチパネル）
    pager.addEventListener('touchstart', function (e) {
      onDragStart(e.touches[0].clientX);
    }, { passive: true });
    pager.addEventListener('touchmove', function (e) {
      onDragMove(e.touches[0].clientX);
    }, { passive: true });
    pager.addEventListener('touchend', onDragEnd);

    // マウスドラッグ操作
    pager.addEventListener('mousedown', function (e) {
      onDragStart(e.clientX);
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (isDragging) onDragMove(e.clientX);
    });
    window.addEventListener('mouseup', onDragEnd);

    window.addEventListener('resize', function () {
      updatePosition(false);
    });

    updatePosition(false);
  })();

  // metaタグによる自動リロードだと、一部のWebView環境で再読み込み時に
  // 画面が真っ白になることがあるため、JavaScriptによるリロードに変更している
  setTimeout(function () {
    location.reload();
  }, 60000);
</script>
